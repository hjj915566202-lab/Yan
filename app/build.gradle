plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.ledger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.offline.ledger'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
