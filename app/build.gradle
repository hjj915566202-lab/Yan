plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offline.ledger'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hjj.nutritionledger'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '2.4.0'
    }

    signingConfigs {
        stable {
            storeFile rootProject.file('nutrition-ledger.jks')
            storePassword 'nutrition123'
            keyAlias 'nutritionledger'
            keyPassword 'nutrition123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
