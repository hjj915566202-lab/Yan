name: Build Offline Ledger APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Align unsigned APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk offline-savings-ledger-aligned-unsigned.apk
          cp $ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: offline-savings-ledger-unsigned
          path: |
            offline-savings-ledger-aligned-unsigned.apk
            apksigner.jar
          retention-days: 7
