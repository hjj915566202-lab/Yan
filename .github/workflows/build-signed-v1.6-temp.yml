name: Export Android Build Tools 35

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK Build Tools
        run: sdkmanager "build-tools;35.0.0"
      - name: Collect signing tools
        run: |
          mkdir -p android-build-tools-35/lib android-build-tools-35/lib64
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-build-tools-35/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-build-tools-35/lib/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" android-build-tools-35/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++.so" android-build-tools-35/lib64/
          chmod +x android-build-tools-35/apksigner android-build-tools-35/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-signing
          path: android-build-tools-35
          retention-days: 1
