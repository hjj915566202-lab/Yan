name: Build Aligned Offline Ledger v1.12.0

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aligned:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verify-v1.12.0-quick-ranges-paypay
      - name: Apply v1.6.0 and v1.7.0 source patches
        run: |
          cat v1.6-patch.part00 v1.6-patch.part01 v1.6-patch.part02 v1.6-patch.part03 | base64 -d | gzip -d > /tmp/v1.6-complete.patch
          git apply --exclude=README.md --exclude=app/src/main/java/com/offline/ledger/ExpenseTrendView.java --exclude=app/src/main/java/com/offline/ledger/ExpensePieView.java /tmp/v1.6-complete.patch
          base64 -d v1.7.patch.gz.b64 | gzip -d > /tmp/v1.7.patch
          git apply /tmp/v1.7.patch
      - name: Apply v1.8.0 source changes
        run: python3 apply-v1.8.py
      - name: Apply v1.9.0 UI redesign
        run: |
          cat v1.9-ui.part00 v1.9-ui.part01 v1.9-ui.part02a v1.9-ui.part02b v1.9-ui.part03 v1.9-ui.part04 | base64 -d | gzip -d > /tmp/v1.9-ui.patch
          git apply /tmp/v1.9-ui.patch
      - name: Apply v1.9.1 plan reset
        run: python3 apply-v1.9.1.py
      - name: Apply v1.10.0 notification merge
        run: |
          cat v1.10-patch.part00 v1.10-patch.part01 v1.10-patch.part02 v1.10-patch.part03 v1.10-patch.part04 > /tmp/v1.10.patch
          git apply /tmp/v1.10.patch
      - name: Apply v1.11.0 trend granularity
        run: |
          cat v1.11.patch.part00 v1.11.patch.part01 v1.11.patch.part02 > /tmp/v1.11.patch
          git apply /tmp/v1.11.patch
      - name: Apply v1.12.0 quick ranges and PayPay default
        run: |
          cat v1.12.patch.part00 v1.12.patch.part01 v1.12.patch.part02 > /tmp/v1.12.patch
          git apply /tmp/v1.12.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Align release APK
        run: $ANDROID_HOME/build-tools/35.0.0/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk offline-savings-ledger-v1.12.0-aligned-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: offline-savings-ledger-v1.12.0-aligned-unsigned
          path: offline-savings-ledger-v1.12.0-aligned-unsigned.apk
          retention-days: 7
