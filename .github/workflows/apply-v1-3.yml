name: Apply v1.3 fixed-expense patch

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v1-3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_v1_3_patch.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add recurring editable fixed expense rules"
          git push
